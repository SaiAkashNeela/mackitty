name: Build, Sign & Notarize MacKitty

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-notarize:
    name: Build Universal DMG & Notarize
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Universal Release Binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN_PATH="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          echo "BIN_PATH=$BIN_PATH" >> $GITHUB_ENV

      - name: Assemble MacKitty.app Bundle
        run: |
          APP_NAME="MacKitty"
          BUNDLE_DIR="dist/$APP_NAME.app"
          CONTENTS_DIR="$BUNDLE_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"

          rm -rf dist && mkdir -p dist
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          # Copy Universal Binary
          cp "$BIN_PATH/$APP_NAME" "$MACOS_DIR/$APP_NAME"
          chmod +x "$MACOS_DIR/$APP_NAME"

          # Copy SPM Resource Bundle
          if [ -d "$BIN_PATH/${APP_NAME}_${APP_NAME}.bundle" ]; then
            cp -R "$BIN_PATH/${APP_NAME}_${APP_NAME}.bundle" "$RESOURCES_DIR/"
          fi

          # Copy App Assets
          if [ -f "Sources/MoleMate/AppIcon.icns" ]; then
            cp "Sources/MoleMate/AppIcon.icns" "$RESOURCES_DIR/AppIcon.icns"
          fi
          if [ -f "Sources/MoleMate/logo.png" ]; then
            cp "Sources/MoleMate/logo.png" "$RESOURCES_DIR/logo.png"
          fi
          if [ -f "Sources/MoleMate/tray_icon.png" ]; then
            cp "Sources/MoleMate/tray_icon.png" "$RESOURCES_DIR/tray_icon.png"
          fi

          # Generate Info.plist
          cat > "$CONTENTS_DIR/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>MacKitty</string>
            <key>CFBundleIdentifier</key>
            <string>com.mackitty.app</string>
            <key>CFBundleName</key>
            <string>MacKitty</string>
            <key>CFBundleDisplayName</key>
            <string>MacKitty</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>LSUIElement</key>
            <false/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          EOF

      - name: Import Apple Developer ID Certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-build-keychain-pass' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')

      - name: Code Sign MacKitty.app (Hardened Runtime)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Find Developer ID Identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application:" | head -n 1 | awk -F '"' '{print $2}')
          echo "Signing with identity: $SIGNING_IDENTITY"

          # Sign all embedded frameworks/bundles first, then app binary
          codesign --deep --force --verify --verbose \
            --sign "$SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            "dist/MacKitty.app"

          # Verify signature
          codesign -dv --verbose=4 "dist/MacKitty.app"

      - name: Create MacKitty.dmg Installer
        run: |
          DMG_STAGING="dist/dmg_staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"

          cp -R "dist/MacKitty.app" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"

          hdiutil create \
            -volname "MacKitty" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "dist/MacKitty.dmg"

      - name: Sign & Notarize MacKitty.dmg
        if: env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application:" | head -n 1 | awk -F '"' '{print $2}')
          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" --timestamp "dist/MacKitty.dmg"
          fi

          echo "Submitting DMG to Apple Notary Service..."
          xcrun notarytool submit "dist/MacKitty.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "dist/MacKitty.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "dist/MacKitty.dmg" || true

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacKitty-Universal-DMG
          path: dist/MacKitty.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacKitty.dmg
          generate_release_notes: true
