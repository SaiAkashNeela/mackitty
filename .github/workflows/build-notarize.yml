name: Build, Sign & Notarize MacKitty

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-notarize:
    name: Build Universal DMG & Notarize
    runs-on: macos-14
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(cat VERSION 2>/dev/null || echo "1.0.0")
            VER=$(echo "$VER" | tr -d '[:space:]')
            TAG="v$VER"
          fi
          echo "VERSION=$VER" >> $GITHUB_OUTPUT
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Building MacKitty version $VER (tag: $TAG)"

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Cache Swift Build Artifacts
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-universal-${{ hashFiles('Package.swift', 'Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-spm-universal-

      - name: Build Universal Release Binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN_PATH="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          echo "BIN_PATH=$BIN_PATH" >> $GITHUB_ENV

      - name: Assemble MacKitty.app Bundle
        run: |
          APP_NAME="MacKitty"
          BUNDLE_DIR="dist/$APP_NAME.app"
          CONTENTS_DIR="$BUNDLE_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"
          VER="${{ steps.versioning.outputs.VERSION }}"

          rm -rf dist && mkdir -p dist
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          # Copy Universal Binary
          cp "$BIN_PATH/$APP_NAME" "$MACOS_DIR/$APP_NAME"
          chmod +x "$MACOS_DIR/$APP_NAME"

          # Copy SPM Resource Bundle
          if [ -d "$BIN_PATH/${APP_NAME}_${APP_NAME}.bundle" ]; then
            cp -R "$BIN_PATH/${APP_NAME}_${APP_NAME}.bundle" "$RESOURCES_DIR/"
          fi

          # Copy App Assets
          if [ -f "Sources/MoleMate/AppIcon.icns" ]; then
            cp "Sources/MoleMate/AppIcon.icns" "$RESOURCES_DIR/AppIcon.icns"
          fi
          if [ -f "Sources/MoleMate/logo.png" ]; then
            cp "Sources/MoleMate/logo.png" "$RESOURCES_DIR/logo.png"
          fi
          if [ -f "Sources/MoleMate/tray_icon.png" ]; then
            cp "Sources/MoleMate/tray_icon.png" "$RESOURCES_DIR/tray_icon.png"
          fi

          # Generate Info.plist with exact version
          cat > "$CONTENTS_DIR/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>MacKitty</string>
            <key>CFBundleIdentifier</key>
            <string>com.mackitty.app</string>
            <key>CFBundleName</key>
            <string>MacKitty</string>
            <key>CFBundleDisplayName</key>
            <string>MacKitty</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundleShortVersionString</key>
            <string>$VER</string>
            <key>CFBundleVersion</key>
            <string>$VER</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>LSUIElement</key>
            <false/>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
          </dict>
          </plist>
          EOF

      - name: Import Apple Developer ID Certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="temporary-build-keychain-pass"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode p12 certificate
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "${APPLE_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          rm -f "$RUNNER_TEMP/certificate.p12"

          # Allow codesign tool access without UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')

          # Find Developer ID identity and export
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "❌ ERROR: No 'Developer ID Application' certificate found in imported keychain!"
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "Successfully configured signing identity: $SIGNING_IDENTITY"

      - name: Code Sign MacKitty.app (Hardened Runtime)
        if: env.SIGNING_IDENTITY != ''
        run: |
          echo "Signing MacKitty.app with identity: $SIGNING_IDENTITY"

          codesign --deep --force --verify --verbose \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            --options runtime \
            --timestamp \
            "dist/MacKitty.app"

          # Strict signature verification
          codesign --verify --deep --strict --verbose=4 "dist/MacKitty.app"

      - name: Create MacKitty.dmg Installer
        run: |
          DMG_STAGING="dist/dmg_staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"

          cp -R "dist/MacKitty.app" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"

          hdiutil create \
            -volname "MacKitty" \
            -srcfolder "$DMG_STAGING" \
            -ov -format UDZO \
            "dist/MacKitty.dmg"

      - name: Sign & Notarize MacKitty.dmg
        if: env.APPLE_APP_SPECIFIC_PASSWORD != '' || env.APPLE_API_KEY_ID != ''
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing MacKitty.dmg with $SIGNING_IDENTITY..."
            codesign --force --keychain "$KEYCHAIN_PATH" --sign "$SIGNING_IDENTITY" --timestamp "dist/MacKitty.dmg"
            codesign --verify --verbose=4 "dist/MacKitty.dmg"
          fi

          if [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ]; then
            echo "Submitting DMG to Apple Notary Service using App Store Connect API Key..."
            P8_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$P8_PATH"

            xcrun notarytool submit "dist/MacKitty.dmg" \
              --key "$P8_PATH" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait
            rm -f "$P8_PATH"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "Submitting DMG to Apple Notary Service using Apple ID + App-Specific Password..."
            xcrun notarytool submit "dist/MacKitty.dmg" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
          else
            echo "❌ ERROR: No notarization credentials provided."
            exit 1
          fi

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "dist/MacKitty.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "dist/MacKitty.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacKitty-Universal-DMG
          path: dist/MacKitty.dmg

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: MacKitty ${{ steps.versioning.outputs.TAG }}
          files: dist/MacKitty.dmg
          generate_release_notes: true
          make_latest: true
